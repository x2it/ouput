<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 背景 -->
  <rect width="100" height="100" rx="20" fill="#1a1a1a"/>
  
  <!-- 猫爪印 -->
  <g fill="#ffffff">
    <!-- 主肉垫 -->
    <ellipse cx="50" cy="55" rx="18" ry="16"/>
    
    <!-- 四个脚趾 -->
    <circle cx="30" cy="35" r="8"/>
    <circle cx="50" cy="28" r="8"/>
    <circle cx="70" cy="35" r="8"/>
    <circle cx="75" cy="50" r="6"/>
  </g>
  
  <!-- 仓库盒子（简化） -->
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="20" y="70" width="60" height="15" rx="2"/>
    <line x1="35" y1="70" x2="35" y2="85"/>
    <line x1="50" y1="70" x2="50" y2="85"/>
    <line x1="65" y1="70" x2="65" y2="85"/>
  </g>
</svg>
